name: Browser and performance validation (no deployment)
on:
  push:
    branches: [professional-upgrade, main]
    paths:
      - 'index.html'
      - 'portal.css'
      - 'portal.js'
      - 'runtime.js'
      - 'footer.js'
      - 'public.css'
      - 'about/**'
      - 'history/**'
      - 'membership/**'
      - 'genealogy/**'
      - 'tests/browser-smoke.cjs'
      - 'scripts/build-pages.sh'
      - 'scripts/validate_public_build.py'
      - '.github/workflows/browser-upgrade.yml'
      - 'martyrs/**'
  pull_request:
    paths:
      - 'index.html'
      - 'portal.js'
      - 'runtime.js'
      - 'footer.js'
      - 'security-config.js'
      - 'captcha.js'
      - 'scripts/build-pages.sh'
      - 'scripts/validate_public_build.py'
      - 'portal.css'
      - 'public.css'
      - 'genealogy/**'
      - 'martyrs/**'
      - 'tests/browser-smoke.cjs'
      - '.github/workflows/browser-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and install browser tools
        run: |
          sh scripts/build-pages.sh
          npm install --no-save --ignore-scripts playwright@1.56.1 lighthouse@12.8.2
          npx playwright install --with-deps chromium
      - name: Local browser smoke test and Lighthouse
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/portal-http.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node tests/browser-smoke.cjs
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npx lighthouse http://127.0.0.1:8765/about/ --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lighthouse.json --quiet
          node -e "const r=require('/tmp/lighthouse.json'); console.log(JSON.stringify(Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,v.score])),null,2))"
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npx lighthouse http://127.0.0.1:8765/ --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lighthouse-home.json --quiet
          node -e "const r=require('/tmp/lighthouse-home.json'); console.log(JSON.stringify({page:'home',scores:Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,v.score])),lcp_ms:r.audits['largest-contentful-paint'].numericValue,cls:r.audits['cumulative-layout-shift'].numericValue,tbt_ms:r.audits['total-blocking-time'].numericValue},null,2))"
          node tests/lighthouse-diagnostics.cjs /tmp/lighthouse-home.json
          node -e "const r=require('/tmp/lighthouse-home.json'); if(r.categories.accessibility.score<0.95 || r.categories.performance.score<0.70 || r.audits['cumulative-layout-shift'].numericValue>0.10 || r.audits['largest-contentful-paint'].numericValue>5500) {console.error('Home regression budget failed');process.exit(1)}; if(r.categories.performance.score<0.95 || r.audits['largest-contentful-paint'].numericValue>2500 || r.audits['cumulative-layout-shift'].numericValue>0.1) console.log('::warning::Target CWV or Lighthouse score not met')"

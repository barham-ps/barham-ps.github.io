name: AEGIS ETERNITY independent
on:
  workflow_dispatch:
  schedule:
    - cron: '38 9 * * 2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aegis-eternity-independent.yml'
      - 'scripts/aegis_operational.py'
      - 'tests/test_aegis_operational.py'
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Independent eternity check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/build-pages.sh
          mv dist "$RUNNER_TEMP/eternity-first"
          sh scripts/build-pages.sh
          diff -qr "$RUNNER_TEMP/eternity-first" dist
          bash tests/backup-smoke.sh

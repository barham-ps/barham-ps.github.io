name: Deploy Cloudflare static portal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-deploy.yml'
      - 'scripts/build-pages.sh'
      - 'scripts/validate_public_build.py'
      - 'tests/worker-guard.test.mjs'
      - 'tests/security.test.cjs'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '_headers'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.png'
      - '*.webp'
      - '*.webmanifest'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'security.txt'
      - '.well-known/**'
      - 'about/**'
      - 'history/**'
      - 'membership/**'
      - 'en/**'
      - 'genealogy/**'
      - 'martyrs/**'
      - 'trust/**'
permissions:
  contents: read
concurrency:
  group: cloudflare-portal-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build allowlisted static assets
        run: sh scripts/build-pages.sh
      - name: Run security regression before deployment
        run: node --test tests/security.test.cjs tests/worker-guard.test.mjs
      - name: Deploy to existing Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            # Discover the account only when the scoped token can see exactly one.
            # Never print API response bodies, account details, or the token.
            CLOUDFLARE_ACCOUNT_ID=$(python3 - <<'PY'
          import json, os, re, sys, urllib.request
          try:
              request = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4/accounts?per_page=5",
                  headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"],
                           "Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
              accounts = data.get("result")
              if not data.get("success") or not isinstance(accounts, list) or len(accounts) != 1:
                  raise ValueError("account is not uniquely discoverable")
              if data.get("result_info", {}).get("total_count", 1) != 1:
                  raise ValueError("account is not uniquely discoverable")
              account_id = accounts[0].get("id", "")
              if not re.fullmatch(r"[0-9a-fA-F]{32}", account_id):
                  raise ValueError("unexpected account identifier")
              print(account_id)
          except Exception:
              print("::error::Cannot discover exactly one authorized Cloudflare account. Configure CLOUDFLARE_ACCOUNT_ID as a GitHub Actions secret.", file=sys.stderr)
              sys.exit(1)
          PY
            )
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
            export CLOUDFLARE_ACCOUNT_ID
          fi
          npx --yes wrangler@4.168.0 deploy
      - name: Verify all six live security controls
        run: |
          python3 - <<'PY'
          import http.client, ssl, re, time, pathlib
          host = "barham-ps-github-io.m0had-b0rh0m.workers.dev"
          def probe(path, max_bytes=0):
              conn = http.client.HTTPSConnection(host, timeout=20, context=ssl.create_default_context())
              try:
                  conn.request("GET", path, headers={"User-Agent": "PortalSecurityMonitor/1.0", "Accept-Encoding": "identity", "Cache-Control": "no-cache"})
                  response = conn.getresponse()
                  if response.status != 200:
                      raise RuntimeError(f"{path}: HTTP {response.status}; cf-mitigated={response.headers.get('cf-mitigated', 'none')}")
                  return response.headers, response.read(max_bytes) if max_bytes else b""
              finally:
                  conn.close()
          for attempt in range(5):
              try:
                  h, _ = probe("/")
                  csp = h.get("Content-Security-Policy", "")
                  hsts = re.search(r"max-age\s*=\s*(\d+)", h.get("Strict-Transport-Security", ""), re.I)
                  policy = h.get("Permissions-Policy", "")
                  checks = {
                      "CSP": "default-src" in csp and "object-src 'none'" in csp,
                      "Clickjacking": "frame-ancestors 'none'" in csp and h.get("X-Frame-Options", "").lower() == "deny",
                      "HSTS": bool(hsts and int(hsts.group(1)) >= 31536000),
                      "MIME": h.get("X-Content-Type-Options", "").lower() == "nosniff",
                      "Referrer": h.get("Referrer-Policy", "").lower() == "no-referrer",
                      "Permissions": all(re.search(r"(?:^|,)\s*" + f + r"\s*=\s*\(\s*\)\s*(?:,|$)", policy) for f in ("camera", "microphone", "geolocation")),
                  }
                  for key, passed in checks.items():
                      print(key, "PASS" if passed else "FAIL")
                  if all(checks.values()):
                      expected = pathlib.Path("dist/security-config.js").read_bytes()
                      _, actual = probe("/security-config.js", len(expected) + 1)
                      if actual != expected:
                          raise RuntimeError("Live security configuration differs from release")
                      print("Live security configuration matches release")
                      expected_trust = pathlib.Path("dist/trust/index.html").read_bytes()
                      _, actual_trust = probe("/trust/", len(expected_trust) + 1)
                      if actual_trust != expected_trust:
                          raise RuntimeError("Live trust center differs from release")
                      print("Live trust center matches release")
                      break
              except Exception as exc:
                  print(type(exc).__name__, str(exc))
              if attempt == 4:
                  raise SystemExit("Live security verification failed")
              time.sleep(15)
          PY
      - name: Verify live request interception
        run: |
          python3 - <<'PY'
          import http.client, ssl, time
          host="barham-ps-github-io.m0had-b0rh0m.workers.dev"
          checks=(("GET","/security-firewall-check",204,"active"),("GET","/.env",404,"path-blocked"),("POST","/security-firewall-check",405,"method-blocked"))
          for attempt in range(5):
              failed=[]
              for method,path,status,marker in checks:
                  c=http.client.HTTPSConnection(host,timeout=15,context=ssl.create_default_context())
                  try:
                      c.request(method,path,headers={"User-Agent":"PortalSecurityMonitor/1.0","Cache-Control":"no-cache"})
                      r=c.getresponse()
                      if r.status==status and r.headers.get("X-Family-Guard")==marker:
                          print(marker,"PASS")
                      else:
                          failed.append(marker)
                          print(marker,"not verified","HTTP",r.status)
                  except Exception:
                      failed.append(marker)
                  finally: c.close()
              if not failed: break
              if attempt==4: raise SystemExit("Live request interception not confirmed: "+", ".join(failed))
              time.sleep(15)
          PY

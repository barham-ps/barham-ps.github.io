name: AEGIS AXIOM independent
on:
  workflow_dispatch:
  schedule:
    - cron: '28 9 * * 2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aegis-axiom-independent.yml'
      - 'scripts/aegis_operational.py'
      - 'tests/test_aegis_operational.py'
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Independent axiom check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/build-pages.sh
          python3 scripts/validate_public_build.py dist
          node --test tests/security.test.cjs
          bash tests/restore-drill.sh

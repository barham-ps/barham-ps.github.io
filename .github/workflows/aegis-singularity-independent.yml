name: AEGIS SINGULARITY independent
on:
  workflow_dispatch:
  schedule:
    - cron: '33 9 * * 2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aegis-singularity-independent.yml'
      - 'scripts/aegis_operational.py'
      - 'tests/test_aegis_operational.py'
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Independent singularity check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          names=['aegis-integrity.yml','aegis-guardian.yml','aegis-defense.yml','aegis-nemesis.yml','aegis-absolute.yml','aegis-cosmic.yml','aegis-generation-three.yml']
          bad=[]
          for n in names:
           url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/'+n+'/runs?branch=main&status=completed&per_page=1'
           req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
           with urllib.request.urlopen(req,timeout=20) as f: rows=json.load(f)['workflow_runs']
           state=rows[0]['conclusion'] if rows else 'missing'
           print(n,state)
           if state!='success': bad.append(n)
          if bad: raise SystemExit('Non-successful completed checks: '+', '.join(bad))
          PY

name: AEGIS ATLAS independent
on:
  workflow_dispatch:
  schedule:
    - cron: '8 9 * * 2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aegis-atlas-independent.yml'
      - 'scripts/aegis_operational.py'
      - 'tests/test_aegis_operational.py'
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Independent atlas check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/build-pages.sh
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from scripts.validate_public_build import validate
          p=Path('dist')
          validate(p)
          rows=[dict(path=str(f.relative_to(p)),size=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest()) for f in sorted(p.rglob('*')) if f.is_file()]
          Path('atlas-inventory.json').write_text(json.dumps(rows,indent=2))
          print('Public assets:',len(rows))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atlas-public-inventory
          path: atlas-inventory.json
          retention-days: 30

name: Compliance readiness evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '22 6 * * 1'
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check readiness evidence inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('README','CONTROL-MATRIX','RISK-REGISTER','POLICIES','AUDIT-PLAN','EVIDENCE'):
              assert Path('compliance',name+'.md').stat().st_size > 0
          matrix=Path('compliance/CONTROL-MATRIX.md').read_text()
          for i in range(1,17):
              assert f'| C{i:02d} |' in matrix
          assert 'not certification' in Path('compliance/README.md').read_text()
          print('Readiness document inventory verified; not a conformity audit.')
          PY
      - name: Verify compliance records excluded from static release
        run: |
          sh scripts/build-pages.sh
          test ! -e dist/compliance
          test ! -e dist/SECURITY-GOVERNANCE.md

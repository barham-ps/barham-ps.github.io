name: Cloudflare transport evidence
on:
  schedule:
    - cron: '31 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HOST: barham-ps-github-io.m0had-b0rh0m.workers.dev
    steps:
      - name: Verify TLS 1.3 and inspect HTTP3
        run: |
          set -eu
          curl --fail --silent --show-error --tlsv1.3 --tls-max 1.3 --max-time 20 -I "https://$HOST/" > "$RUNNER_TEMP/headers"
          echo 'TLS 1.3 connection verified'
          if grep -Eiq '^alt-svc:.*h3' "$RUNNER_TEMP/headers"; then echo 'HTTP3 advertised'; else echo 'HTTP3 not advertised'; fi
          if curl -V | grep -q HTTP3; then
            curl --http3-only --fail --silent --show-error --max-time 20 -I -o /dev/null -w 'HTTP version: %{http_version}\n' "https://$HOST/" || echo 'HTTP3 negotiation not verified'
          else echo 'Runner lacks HTTP3 support'; fi
      - name: Probe hybrid post-quantum key agreement
        run: |
          set -eu
          if openssl list -tls-groups 2>/dev/null | grep -qi X25519MLKEM768; then
            if timeout 25 openssl s_client -connect "$HOST:443" -servername "$HOST" -verify_hostname "$HOST" -verify_return_error -tls1_3 -groups X25519MLKEM768 -brief </dev/null > "$RUNNER_TEMP/pqc" 2>&1; then
              if grep -qi X25519MLKEM768 "$RUNNER_TEMP/pqc"; then echo 'Hybrid PQ key agreement verified'; else echo 'Handshake succeeded; group evidence unavailable'; fi
            else echo 'Hybrid PQ negotiation not verified'; fi
          else echo 'Runner lacks hybrid PQ group support'; fi

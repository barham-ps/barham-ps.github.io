name: AEGIS HORIZON independent
on:
  workflow_dispatch:
  schedule:
    - cron: '18 9 * * 2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aegis-horizon-independent.yml'
      - 'scripts/aegis_operational.py'
      - 'tests/test_aegis_operational.py'
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Independent horizon check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          work=$(mktemp -d)
          cd "$work"
          npm init -y >/dev/null
          npm install --package-lock-only --ignore-scripts --no-audit --save-exact @supabase/supabase-js@2.119.2 qrcodejs@1.0.0
          npm audit --audit-level=high

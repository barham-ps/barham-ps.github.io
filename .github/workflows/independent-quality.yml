name: Independent open-source quality diagnostics
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/independent-quality.yml'
      - 'scripts/**'
      - 'tests/**'
      - '**.html'
      - '**.css'
      - '**.sql'
      - '**.md'
      - '**.yml'
      - '**.yaml'
      - 'manifest.webmanifest'
      - 'sitemap.xml'
      - 'icon.svg'
  push:
    branches: [main]
    paths:
      - '.github/workflows/independent-quality.yml'
      - 'scripts/**'
      - 'tests/**'
      - '**.html'
      - '**.css'
      - '**.sql'
      - '**.md'
      - '**.yml'
      - '**.yaml'
      - 'manifest.webmanifest'
      - 'sitemap.xml'
      - 'icon.svg'
  schedule:
    - cron: '12 * * * *'
permissions:
  contents: read
concurrency:
  group: independent-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Ubuntu archive packages (no third-party installer)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck shfmt yamllint tidy libxml2-utils python3-bandit pyflakes3 vulture codespell sqlfluff markdownlint python3-jsonschema python3-tinycss2
      - name: Test result classification
        run: /usr/bin/python3 -m unittest discover -s tests -p test_independent_quality.py
      - name: Run 13 independent diagnostics
        run: /usr/bin/python3 scripts/independent_quality.py --report "$RUNNER_TEMP/independent-quality.json"
      - name: Generate format-only candidate in isolated checkout
        run: |
          /usr/bin/python3 scripts/safe_quality_fix.py --report "$RUNNER_TEMP/safe-quality-fix.json"
          git diff --check
          # Enforce the scope independently of the generator.
          git diff --name-only | while IFS= read -r path; do
            case "$path" in tests/*.sh) bash -n "$path" ;; *) exit 1 ;; esac
          done
          if ! git diff --quiet -- tests; then
            node --test tests/security.test.cjs tests/upgrade.test.cjs tests/worker-guard.test.mjs
            bash tests/backup-smoke.sh
            bash tests/restore-drill.sh
          fi
          git diff -- tests/*.sh > "$RUNNER_TEMP/safe-quality-fix.patch"
      - name: Upload tested candidate (never deploy from this job)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: safe-quality-candidate
          path: |
            ${{ runner.temp }}/safe-quality-fix.json
            ${{ runner.temp }}/safe-quality-fix.patch
          retention-days: 7
      - name: Publish sanitized status, not source snippets
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/independent-quality.json"; then
            /usr/bin/python3 - "$RUNNER_TEMP/independent-quality.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          rows = json.load(open(sys.argv[1]))
          print("## Independent diagnostics (advisory findings)")
          print("| Tool | Package version | State |")
          print("|---|---|---|")
          for row in rows:
              print(f"| {row['tool']} | {row['package_version']} | {row['state']} |")
          print("\nA successful job means diagnostics ran; review-required is NOT a clean result.")
          PY
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: independent-quality-status
          path: ${{ runner.temp }}/independent-quality.json
          if-no-files-found: warn
          retention-days: 14

name: Signed release evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and test public release
        run: |
          sh scripts/build-pages.sh
          node --test tests/security.test.cjs tests/upgrade.test.cjs
          python3 scripts/validate_public_build.py dist
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf "$RUNNER_TEMP/portal.tar" -C dist .
          mv dist "$RUNNER_TEMP/first-dist"
          sh scripts/build-pages.sh
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf "$RUNNER_TEMP/portal-second.tar" -C dist .
          cmp "$RUNNER_TEMP/portal.tar" "$RUNNER_TEMP/portal-second.tar"
          sha256sum "$RUNNER_TEMP/portal.tar"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/portal.tar
      - name: Verify signed build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "$RUNNER_TEMP/portal.tar" --repo "$GITHUB_REPOSITORY" --source-ref refs/heads/main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-public-release
          path: ${{ runner.temp }}/portal.tar
          retention-days: 30

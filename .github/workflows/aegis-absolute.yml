name: AEGIS Absolute Defense IV
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '29 7 * * 1'
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build isolated public fixture
        run: sh scripts/build-pages.sh
      - name: DNA Tribunal Paradox Oblivion Eclipse Axiom
        run: |
          python3 - <<'PY'
          import hashlib, random, tempfile, shutil, json
          from pathlib import Path
          from scripts.validate_public_build import validate, ALLOWED
          root = Path('dist')
          def inventory(p):
              return {str(f.relative_to(p)): hashlib.sha256(f.read_bytes()).hexdigest()
                      for f in p.rglob('*') if f.is_file() and not f.is_symlink()}
          def merkle(items):
              nodes = [hashlib.sha256(b'leaf\\0'+json.dumps([k,v]).encode()).digest() for k,v in sorted(items.items())]
              if not nodes: raise ValueError('empty inventory')
              while len(nodes)>1:
                  if len(nodes)%2: nodes.append(nodes[-1])
                  nodes=[hashlib.sha256(b'node\\0'+nodes[i]+nodes[i+1]).digest() for i in range(0,len(nodes),2)]
              return nodes[0].hex()
          baseline=inventory(root)
          assert set(baseline)==ALLOWED
          validate(root)
          digest=merkle(baseline)
          assert digest==merkle(dict(reversed(list(baseline.items()))))
          rng=random.Random(20261125)
          for i in range(2048):
              altered=dict(baseline)
              k=rng.choice(sorted(altered))
              altered[k]=hashlib.sha256(str(i).encode()).hexdigest()
              assert merkle(altered)!=digest
          with tempfile.TemporaryDirectory() as t:
              fixture=Path(t)/'fixture'
              shutil.copytree(root,fixture)
              for name in ['.env','backup.sql','private/key.pem','nested/.git/config']:
                  p=fixture/name
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text('synthetic only')
                  try: validate(fixture)
                  except ValueError: pass
                  else: raise RuntimeError('unexpected file accepted')
                  p.unlink()
              assert inventory(fixture)==baseline
              (fixture/'portal.js').unlink()
              try: validate(fixture)
              except ValueError: pass
              else: raise RuntimeError('missing asset accepted')
          assert inventory(root)==baseline
          print('Merkle root:',digest)
          print('2048 synthetic digest mutations and 5 filesystem regressions verified')
          PY
      - name: Fortress and Citadel - isolated role boundary regression
        run: bash tests/restore-drill.sh
      - name: Prism - second validation method and source tests
        run: |
          python3 scripts/validate_public_build.py dist
          find dist -type f -name '*.js' -exec sh -c 'for f do node --check "$f" || exit 1; done' sh {} +
          node --test tests/security.test.cjs tests/upgrade.test.cjs
      - name: Eternity - rebuild comparison
        run: |
          mv dist "$RUNNER_TEMP/aegis-iv-first"
          sh scripts/build-pages.sh
          diff -qr "$RUNNER_TEMP/aegis-iv-first" dist
      - name: Atlas and Aeon - public inventory and security history
        run: |
          find dist -type f | sort
          git log -10 --format='%h %cs' -- .github/workflows scripts tests

name: Read-only live release evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/release_verify.py'
      - 'scripts/protocol_probe.sh'
      - 'runtime.js'
      - '.github/workflows/live-release-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-baseline:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: baseline
      - name: Verify current production baseline
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/release_verify.py --full --source-dir baseline; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Read public health and response headers
        if: always()
        run: python3 scripts/production_monitor.py
      - name: Read public compression evidence
        if: always()
        run: python3 scripts/edge_probe.py --host barham-ps.github.io
      - name: Verify Brotli body and HTTP3 evidence
        if: always()
        run: bash scripts/protocol_probe.sh
  local-static-baseline:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build isolated static site
        run: sh scripts/build-pages.sh
      - name: Loopback-only static concurrency baseline
        run: python3 scripts/local_static_load.py

# Only the single previously published client key; never allowlist a secret key.
# Raw historical and deployment scans remain in the workflow.
[extend]
useDefault = true

[[allowlists]]
description = "Exact existing Supabase publishable client key in portal.js and runtime.js only"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['(^|/)(portal|runtime)\.js$']
regexTarget = "secret"
regexes = ['^sb_publishable_-LW-iVjvk4hmvdzcR9jgYw_my4buOkw$']
